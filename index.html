<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DIRECT VOICE</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0b0f17;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: #131a26;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 16px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .mic-banner {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .mic-banner.active {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.4);
    }
    .mic-text { font-size: 12.5px; color: #fde68a; line-height: 1.4; }
    .mic-banner.active .mic-text { color: #a7f3d0; }
    .btn-amber {
      background: #f59e0b;
      color: #0b0f17;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .id-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .my-id {
      font-size: 22px;
      font-weight: 800;
      color: #34d399;
      letter-spacing: 0.5px;
    }
    .mini-btns { display: flex; gap: 6px; }
    .btn-dark {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-link {
      width: 100%;
      margin-top: 12px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    input {
      width: 100%;
      background: #0b0f17;
      border: 1px solid #263244;
      border-radius: 12px;
      padding: 13px 14px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #10b981; }
    .btn-green {
      width: 100%;
      background: #10b981;
      color: #052e16;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-red {
      width: 100%;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    @keyframes ringPulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .incoming-box {
      display: none;
      background: #0f2922;
      border: 2px solid #10b981;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      animation: ringPulse 1.4s infinite;
    }
    .incoming-box.show { display: block; }
    .incoming-title { font-size: 12px; color: #6ee7b7; font-weight: 700; letter-spacing: 1px; }
    .caller-name { font-size: 22px; font-weight: 800; margin: 6px 0 14px; color: #fff; }
    .call-actions { display: flex; gap: 10px; }
    .active-call {
      display: none;
      background: #111c2e;
      border: 1px solid #3b82f6;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
    }
    .active-call.show { display: block; }
    .timer { font-size: 24px; font-weight: 800; color: #60a5fa; margin: 8px 0 14px; }
    .friend-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #0b0f17;
      border-radius: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card header">
      <div class="brand"><span class="dot" id="statusDot"></span> DIRECT VOICE</div>
      <span class="badge" id="statusBadge">CONNECTING...</span>
    </div>

    <div class="mic-banner" id="micBanner">
      <div class="mic-text" id="micText">Mic Access Required: Tap Allow so your friend can hear you.</div>
      <button class="btn-amber" id="allowMicBtn" onclick="enableMic()">Allow Mic</button>
    </div>

    <div class="incoming-box" id="incomingBox">
      <div class="incoming-title">INCOMING VOICE CALL...</div>
      <div class="caller-name" id="incomingCaller">Unknown</div>
      <div class="call-actions">
        <button class="btn-green" onclick="acceptCall()">Accept</button>
        <button class="btn-red" onclick="rejectCall()">Decline</button>
      </div>
    </div>

    <div class="active-call" id="activeCallBox">
      <div class="label" style="color:#93c5fd;">CONNECTED VOICE CHANNEL</div>
      <div class="caller-name" id="connectedPeer">Friend</div>
      <div class="timer" id="callTimer">00:00</div>
      <div class="call-actions">
        <button class="btn-dark" style="flex:1; padding:12px;" id="muteBtn" onclick="toggleMute()">Mute Mic</button>
        <button class="btn-red" style="flex:1;" onclick="endCall()">End Call</button>
      </div>
    </div>

    <div class="card">
      <div class="label">YOUR UNIQUE CALLER ID</div>
      <div class="id-row">
        <div class="my-id" id="myIdText">jai-1234</div>
        <div class="mini-btns">
          <button class="btn-dark" onclick="copyId()">Copy ID</button>
          <button class="btn-dark" onclick="editId()">Edit</button>
        </div>
      </div>
      <button class="btn-link" onclick="copyCallLink()">Copy Direct Call Link (Share to Call Me)</button>
    </div>

    <div class="card">
      <div class="label">CALL YOUR FRIEND</div>
      <input type="text" id="friendIdInput" placeholder="Enter Friend ID or Paste Call Link" />
      <button class="btn-green" onclick="startCall()">Start Voice Call</button>
    </div>

    <div class="card">
      <div class="label">RECENT / SAVED FRIENDS</div>
      <div id="friendsList" style="font-size:13px; color:#64748b;">No saved friends yet.</div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    let peer = null;
    let localStream = null;
    let currentCall = null;
    let incomingCallObj = null;
    let ringInterval = null;
    let audioCtx = null;
    let timerInterval = null;
    let seconds = 0;
    let isMuted = false;

    let myId = localStorage.getItem('dv_id') || ('jai-' + Math.floor(1000 + Math.random() * 9000));
    localStorage.setItem('dv_id', myId);
    document.getElementById('myIdText').innerText = myId;

    const urlParams = new URLSearchParams(window.location.search);
    const autoTarget = urlParams.get('call');
    if (autoTarget) {
      document.getElementById('friendIdInput').value = autoTarget;
    }

    function startRingtone() {
      stopRingtone();
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}

      const playTone = () => {
        if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [523.25, 659.25].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.18);
          gain.gain.setValueAtTime(0.08, now + i * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.18);
          osc.stop(now + i * 0.18 + 0.36);
        });
      };

      playTone();
      ringInterval = setInterval(playTone, 2000);
    }

    function stopRingtone() {
      if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
      if (navigator.vibrate) navigator.vibrate(0);
    }

    function notifyIncoming(caller) {
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        new Notification('DIRECT VOICE - Incoming Call', {
          body: caller + ' is calling you...',
          tag: 'dv-call'
        });
      }
    }

    async function enableMic() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById('micBanner').classList.add('active');
        document.getElementById('micText').innerText = 'Mic Active: Ready for crystal-clear voice calls.';
        document.getElementById('allowMicBtn').innerText = 'Active';
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (err) {
        alert('Please allow Microphone permission in browser settings.');
      }
    }

    function initPeer(id) {
      if (peer) peer.destroy();
      peer = new Peer(id);

      peer.on('open', () => {
        document.getElementById('statusBadge').innerText = 'ONLINE';
        document.getElementById('statusDot').style.background = '#10b981';
        if (autoTarget && autoTarget !== myId) {
          startCall();
        }
      });

      peer.on('call', (call) => {
        incomingCallObj = call;
        document.getElementById('incomingCaller').innerText = call.peer;
        document.getElementById('incomingBox').classList.add('show');
        startRingtone();
        notifyIncoming(call.peer);
      });

      peer.on('error', () => {
        document.getElementById('statusBadge').innerText = 'RETRYING...';
        document.getElementById('statusDot').style.background = '#f59e0b';
      });
    }

    async function startCall() {
      let rawInput = document.getElementById('friendIdInput').value.trim();
      if (!rawInput) return alert('Enter Friend ID or Paste Call Link first!');

      if (rawInput.includes('?call=')) {
        rawInput = rawInput.split('?call=')[1].split('&')[0].trim();
        document.getElementById('friendIdInput').value = rawInput;
      }

      if (!localStream) await enableMic();
      if (!localStream) return;

      saveFriend(rawInput);
      const call = peer.call(rawInput, localStream);
      setupCallEvents(call, rawInput);
    }

    async function acceptCall() {
      stopRingtone();
      document.getElementById('incomingBox').classList.remove('show');
      if (!localStream) await enableMic();
      if (!incomingCallObj || !localStream) return;

      saveFriend(incomingCallObj.peer);
      incomingCallObj.answer(localStream);
      setupCallEvents(incomingCallObj, incomingCallObj.peer);
    }

    function rejectCall() {
      stopRingtone();
      document.getElementById('incomingBox').classList.remove('show');
      if (incomingCallObj) { incomingCallObj.close(); incomingCallObj = null; }
    }

    function setupCallEvents(call, peerName) {
      currentCall = call;
      document.getElementById('connectedPeer').innerText = peerName;
      document.getElementById('activeCallBox').classList.add('show');
      startTimer();

      call.on('stream', (remoteStream) => {
        const audio = document.getElementById('remoteAudio');
        audio.srcObject = remoteStream;
        audio.play().catch(() => {});
      });

      call.on('close', endCall);
      call.on('error', endCall);
    }

    function endCall() {
      stopRingtone();
      if (currentCall) { currentCall.close(); currentCall = null; }
      document.getElementById('activeCallBox').classList.remove('show');
      document.getElementById('incomingBox').classList.remove('show');
      stopTimer();
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      document.getElementById('muteBtn').innerText = isMuted ? 'Unmute Mic' : 'Mute Mic';
    }

    function startTimer() {
      stopTimer();
      seconds = 0;
      timerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        document.getElementById('callTimer').innerText = m + ':' + s;
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      document.getElementById('callTimer').innerText = '00:00';
    }

    function copyId() {
      navigator.clipboard.writeText(myId);
      alert('Copied ID: ' + myId);
    }

    function copyCallLink() {
      const link = window.location.origin + window.location.pathname + '?call=' + myId;
      navigator.clipboard.writeText(link);
      alert('Direct Call Link Copied!\n' + link);
    }

    function editId() {
      const next = prompt('Enter new Caller ID (letters/numbers):', myId);
      if (next && next.trim()) {
        myId = next.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
        localStorage.setItem('dv_id', myId);
        document.getElementById('myIdText').innerText = myId;
        initPeer(myId);
      }
    }

    function saveFriend(id) {
      let list = JSON.parse(localStorage.getItem('dv_friends') || '[]');
      if (!list.includes(id)) { list.unshift(id); list = list.slice(0, 5); }
      localStorage.setItem('dv_friends', JSON.stringify(list));
      renderFriends();
    }

    function renderFriends() {
      const list = JSON.parse(localStorage.getItem('dv_friends') || '[]');
      const box = document.getElementById('friendsList');
      if (!list.length) return;
      box.innerHTML = list.map(f => `
        <div class="friend-item">
          <span style="font-weight:700; color:#e2e8f0;">${f}</span>
          <button class="btn-green" style="width:auto; padding:6px 14px; font-size:12px;" onclick="document.getElementById('friendIdInput').value='${f}'; startCall();">Call</button>
        </div>
      `).join('');
    }

    initPeer(myId);
    renderFriends();
  </script>
</body>
</html>
